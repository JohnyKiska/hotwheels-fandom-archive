name: Build all-years catalog index

on:
  push:
    branches: [main]
    paths:
      - "research/extractions/MAINLINE-*.csv"
      - "research/extractions/MODERN-SPECIAL-SERIES-*.csv"
      - "scripts/build_catalog_index.py"
      - ".github/workflows/build-catalog-index.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build Mainline and Premium index
        run: python3 scripts/build_catalog_index.py
      - name: Commit generated catalog data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/generated/catalog-index.json catalog/generated/catalog-index-stats.json
          if git diff --cached --quiet; then
            echo "Catalog index is already current."
          else
            git commit -m "Build all-years Mainline and Premium catalog index"
            git push
          fi
