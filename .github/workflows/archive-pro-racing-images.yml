name: Archive Pro Racing image review batch
on:
  workflow_dispatch:
    inputs:
      image_limit:
        description: "Maximum number of not-yet-inspected images to fetch"
        required: true
        default: "10"
        type: choice
        options:
          - "10"
          - "20"
          - "30"
permissions:
  contents: write
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Download curated image batch
        env:
          IMAGE_LIMIT: ${{ inputs.image_limit }}
        run: python3 scripts/download_gallery_review_images.py
      - name: Commit downloaded image assets and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/pilot/assets/pro-racing-1-43
          if git diff --cached --quiet; then
            echo "No new image assets to commit."
          else
            git commit -m "Archive Pro Racing 1:43 image review batch"
            git push
          fi
